<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get Started – Duezly</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="favicon-192x192.png" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --orange: #d97706;
      --orange-dark: #b45309;
      --text: #1c1917;
      --muted: #78716c;
      --border: #e7e5e4;
      --bg: #ffffff;
      --bg-warm: #fef9f0;
    }
    body.dark {
      --orange: #f97316;
      --orange-dark: #fb923c;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #1e293b;
      --bg: #0f172a;
      --bg-warm: #111827;
    }
    body.dark nav { background: rgba(15,23,42,0.92); }
    body.dark .card { background: #1e293b; border-color: #2d3748; }
    body.dark .msg.error { background: rgba(153,27,27,0.2); color: #fca5a5; border-color: rgba(153,27,27,0.4); }
    .theme-select {
      font-size: 0.8rem; font-weight: 600;
      background: rgba(0,0,0,0.06); color: var(--text);
      border: 1px solid var(--border); border-radius: 7px;
      padding: 5px 10px; cursor: pointer; font-family: inherit; outline: none;
    }
    body.dark .theme-select { background: rgba(255,255,255,0.08); border-color: #334155; }
    body.dark .theme-select option { background: #1e293b; color: #f1f5f9; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-warm); color: var(--text); -webkit-font-smoothing: antialiased; transition: background 0.2s, color 0.2s; }

    nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0 24px; height: 56px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-logo {
      font-size: 1.3rem; font-weight: 900; letter-spacing: -0.5px; text-decoration: none;
      background: linear-gradient(135deg, #c2410c, #f59e0b);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .nav-right { display: flex; gap: 12px; align-items: center; }

    .page-wrap {
      min-height: calc(100vh - 56px);
      display: flex; align-items: center; justify-content: center;
      padding: 48px 24px;
    }

    .card {
      background: var(--bg);
      border: 1.5px solid #fde68a;
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 400px; width: 100%;
      text-align: center;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
    }
    .card .emoji { font-size: 2.5rem; margin-bottom: 16px; }
    .card h2 { font-size: 1.4rem; font-weight: 900; margin-bottom: 8px; color: var(--text); letter-spacing: -0.3px; }
    .card p { color: var(--muted); font-size: 0.875rem; line-height: 1.6; margin-bottom: 24px; }
    .card .price-note { font-size: 0.78rem; color: var(--muted); margin-top: 16px; margin-bottom: 0; }
    .google-btn-wrap { display: flex; justify-content: center; }

    .status-icon { font-size: 2.5rem; margin-bottom: 16px; }
    .status-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 8px; color: var(--text); }
    .status-sub { color: var(--muted); font-size: 0.875rem; line-height: 1.6; margin-bottom: 0; }
    .spinner {
      width: 36px; height: 36px; margin: 16px auto 8px;
      border: 3px solid var(--border);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .msg { margin-top: 14px; padding: 11px 14px; border-radius: 8px; font-size: 0.875rem; font-weight: 500; display: none; text-align: left; }
    .msg.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block; }

    .hidden { display: none; }

    footer { border-top: 1px solid var(--border); padding: 28px 24px; text-align: center; }
    footer p { font-size: 0.82rem; color: var(--muted); }
    footer a { color: var(--muted); text-decoration: none; }
    footer a:hover { color: var(--orange); }
    .footer-links { display: flex; justify-content: center; gap: 20px; margin-top: 8px; }

    @media (max-width: 480px) { .card { padding: 28px 20px; } }
  </style>
</head>
<body>

  <nav>
    <a href="index.html" class="nav-logo">Duezly ☀️</a>
    <div class="nav-right">
      <select id="theme-select" class="theme-select" onchange="setTheme(this.value)">
        <option value="light">☀️ Light</option>
        <option value="dark">🌙 Dark</option>
      </select>
    </div>
  </nav>

  <div class="page-wrap">

    <!-- Auth: sign in with Google -->
    <div id="auth-screen" class="card">
      <div class="emoji">☀️</div>
      <h2>Get started with Duezly</h2>
      <p>Sign in with Google to set up your daily SMS homework reminders. Takes about 30 seconds.</p>
      <div id="g_id_onload"
        data-client_id="826724045174-q4ur3modo6sje8aab2bhplo33se3353p.apps.googleusercontent.com"
        data-callback="handleGoogleSignIn"
        data-auto_prompt="false">
      </div>
      <div class="google-btn-wrap">
        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular"></div>
      </div>
      <div class="msg" id="auth-msg"></div>
      <p class="price-note">$1.99/month &middot; Cancel anytime &middot; No spam</p>
    </div>

    <!-- Status: loading / signing in -->
    <div id="status-screen" class="card hidden">
      <div class="spinner"></div>
      <div class="status-title" id="status-title">One moment…</div>
      <div class="status-sub" id="status-sub"></div>
    </div>

  </div>

  <footer>
    <p>&copy; 2026 Duezly. All rights reserved.</p>
    <div class="footer-links">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms.html">Terms &amp; Conditions</a>
    </div>
  </footer>

  <script>
    const API = "https://rri54forh2.execute-api.us-east-2.amazonaws.com";
    let sessionToken = localStorage.getItem("duezly_token");

    function show(id) {
      ["auth-screen","status-screen"].forEach(s =>
        document.getElementById(s).classList.toggle("hidden", s !== id)
      );
    }

    function setStatus(title, sub) {
      document.getElementById("status-title").textContent = title;
      document.getElementById("status-sub").textContent = sub;
    }

    function showAuthError(msg) {
      const el = document.getElementById("auth-msg");
      if (el) { el.className = "msg error"; el.textContent = msg; }
    }

    async function handleGoogleSignIn(response) {
      show("status-screen");
      setStatus("Signing you in…", "Just a second.");
      try {
        const res = await fetch(`${API}/auth/google`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id_token: response.credential })
        });
        const data = await res.json();
        if (!res.ok) {
          show("auth-screen");
          showAuthError("Sign in failed. Please try again.");
          return;
        }
        localStorage.setItem("duezly_token", data.token);
        window.location.href = "purchase.html";
      } catch {
        show("auth-screen");
        showAuthError("Network error. Please try again.");
      }
    }

    async function init() {
      // Redirect canceled Stripe sessions from the old flow
      const params = new URLSearchParams(location.search);
      if (params.get("canceled") === "true") {
        window.location.href = "dashboard.html?canceled=true";
        return;
      }

      if (!sessionToken) { show("auth-screen"); return; }

      show("status-screen");
      setStatus("Checking your account…", "One moment.");
      try {
        const res = await fetch(`${API}/user`, {
          headers: { "Authorization": `Bearer ${sessionToken}` }
        });
        if (res.status === 401) {
          localStorage.removeItem("duezly_token");
          sessionToken = null;
          show("auth-screen");
          return;
        }
        window.location.href = "purchase.html";
      } catch {
        show("auth-screen");
      }
    }

    function setTheme(theme) {
      document.body.classList.toggle("dark", theme === "dark");
      localStorage.setItem("duezly_theme", theme);
      const sel = document.getElementById("theme-select");
      if (sel) sel.value = theme;
    }
    setTheme(localStorage.getItem("duezly_theme") || "dark");

    init();
  </script>

</body>
</html>
